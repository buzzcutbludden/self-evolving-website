name: Self-evolving agent cron

# Runs entirely on GitHub's servers every 5 minutes (UTC). No browser,
# visitor, or open site is required. Feedback stays queued until the agent
# successfully processes it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the agent cycle
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPO: buzzcutbludden/self-evolving-website
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: google/gemma-4-31b-it:free
          SITE_URL: https://self-evolving-website.netlify.app
        run: |
          node -e "require('./netlify/functions/_lib.js').runAgentCycle().then(r => console.log('RESULT', JSON.stringify(r))).catch(e => { console.error(e); process.exit(1); })"
